# En producción Caddy termina el TLS y habla con este nginx por HTTP, así que
# $scheme sería "http" y Laravel creería que la petición no venía cifrada.
# Se conserva el valor original si viene, y si no se usa el esquema real.
map $http_x_forwarded_proto $esquema_original {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 20m;

    # El cliente llama a /api en el mismo origen (src/api.js), así que el
    # navegador nunca habla directamente con Laravel: este proxy es el enlace.
    # Sin barra final en proxy_pass para que la ruta /api/... llegue completa.
    location /api {
        proxy_pass http://api:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $esquema_original;
        proxy_read_timeout 60s;
    }

    location /up {
        proxy_pass http://api:80/up;
        access_log off;
    }

    # Los assets con hash en el nombre pueden cachearse indefinidamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
