name: sicep

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_DATABASE:-sicep}
      MARIADB_USER: ${DB_USERNAME:-sicep}
      MARIADB_PASSWORD: ${DB_PASSWORD:-sicep}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      # Atado a 127.0.0.1 a propósito: sirve para conectarse con un cliente
      # desde la propia máquina (o por un túnel SSH), pero no queda expuesto en
      # la IP pública del servidor aunque el cortafuegos abra el puerto.
      - "127.0.0.1:${DB_PORT_HOST:-3306}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      APP_NAME: SICEP-NNA
      APP_ENV: ${APP_ENV:-production}
      # Sin guardia ":?" a propósito: el propio contenedor es lo que genera la
      # clave, y esa comprobación impedía arrancarlo para generarla.
      # Si falta, el entrypoint lo dice y explica cómo obtenerla.
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8080}

      DB_CONNECTION: mariadb
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-sicep}
      DB_USERNAME: ${DB_USERNAME:-sicep}
      DB_PASSWORD: ${DB_PASSWORD:-sicep}

      # La base de datos ya está aquí; evita sumar Redis sólo para esto.
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-warning}
    volumes:
      - api_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_started

volumes:
  db_data:
  api_storage:
